when:
  - event: tag
  - event: manual
    branch: stable

labels:
  platform: linux/amd64

skip_clone: true

steps:
  trigger-deploy:
    image: docker.io/woodpeckerci/plugin-trigger:1.1.1
    settings:
      deploy: 'docs'
      last-successful: true
      token:
        from_secret:
          pleroma-ci-woodpecker-token
      repositories:
        - pleroma/docs@master
