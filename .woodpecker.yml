when:
  - event: [push, pull_request]

steps:
  test:
    image: hexpm/elixir:1.18.3-erlang-27.2.4-alpine-3.21.3
    environment:
      MIX_ENV: test
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: pleroma_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    commands:
      - apk add --no-cache build-base cmake file-dev git openssl postgresql-client ffmpeg exiftool
      - mix local.hex --force
      - mix local.rebar --force
      - mix deps.get
      - |
        for i in $(seq 1 120); do
          if PGPASSWORD=postgres pg_isready -h postgres -U postgres >/dev/null 2>&1; then
            echo "postgres is ready after ${i}s"
            break
          fi
          if [ "$i" -eq 120 ]; then
            echo "ERROR: postgres did not become ready within 120s" >&2
            exit 1
          fi
          sleep 1
        done
      - mix ecto.create
      - mix ecto.migrate
      - mix pleroma.test_runner --cover --preload-modules

services:
  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: pleroma_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    commands:
      - docker-entrypoint.sh postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
